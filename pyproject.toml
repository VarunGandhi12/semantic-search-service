[project]
name = "semantic-search-service"
version = "0.1.0"
description = "Hybrid (BM25 + vector) search and RAG over a document corpus, behind a clean ports-and-adapters FastAPI service."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Varun Gandhi" }]
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "numpy>=1.26",
]

[project.optional-dependencies]
# True semantic embeddings. Heavy (pulls torch); not needed for the default
# offline hashing embedder or for CI.
semantic = ["sentence-transformers>=3.0"]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.5",
    "mypy>=1.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q --cov=app --cov-report=term-missing --cov-fail-under=85"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "C4", "S"]
# Test files may use asserts and hard-coded sample data.
per-file-ignores = { "tests/**" = ["S101"] }

[tool.mypy]
# 3.12 target: NumPy's bundled stubs use PEP 695 `type` statements, which mypy
# only parses when targeting >=3.12. The runtime still supports 3.11 (CI tests it).
python_version = "3.12"
strict = true
ignore_missing_imports = true
